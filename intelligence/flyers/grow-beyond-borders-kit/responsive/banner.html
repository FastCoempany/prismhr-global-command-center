<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow Beyond Borders Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gbb.css">
<style>
  html, body { margin: 0; height: 100%; background: #061f3a; }
  /* The banner fills whatever box it sits in. Here that box is the window: resize it to see each layout. */
  .frame { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div class="frame">
  <div class="gbb" role="img" aria-label="Help Your Clients Grow Beyond Borders, PrismHR Global">
    <div class="gbb-stage">
      <div class="gbb-bg"></div>
      <div class="gbb-halftone"></div>
      <img class="gbb-plexus" src="../components/svg/plexus.svg" alt="">
      <img class="gbb-globe" src="../components/svg/globe.svg" alt="">
      <img class="gbb-tile" src="../components/svg/gbl-tile.svg" alt="">
      <h1 class="gbb-headline">Help Your<br> Clients Grow<br> Beyond Borders</h1>
    </div>
  </div>
</div>
</body>
</html>
