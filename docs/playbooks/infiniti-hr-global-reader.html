  :root {
    --field: #f5f7fb;
    --surface: #ffffff;
    --ink: #0a1c40;
    --ink-66: rgba(10, 28, 64, 0.66);
    --ink-42: rgba(10, 28, 64, 0.42);
    --ink-22: rgba(10, 28, 64, 0.22);
    --ink-10: rgba(10, 28, 64, 0.1);
    --ink-06: rgba(10, 28, 64, 0.06);
    --move: #e6701e;
    --sys: #2563eb;
    --health: #22c55e;
    --caution: #f59e0b;
    --risk: #ef4444;
    --serif: "DM Serif Display", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --lift: 0 1px 2px rgba(10, 28, 64, 0.05), 0 8px 24px -12px rgba(10, 28, 64, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .kicker {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-42);
  }

  /* ── top bar ───────────────────────────────────────────── */
  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 12px 28px;
    background: rgba(245, 247, 251, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--ink-10);
  }
  .bar-id { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
  .bar-id b { font-family: var(--serif); font-size: 18px; font-weight: 400; letter-spacing: -0.01em; }
  .bar-id span { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-42); }

  .clock { display: flex; align-items: baseline; gap: 10px; }
  .clock-now { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .clock-of { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-42); }
  .delta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 3px;
    color: #fff;
    background: var(--ink-42);
    white-space: nowrap;
  }
  .delta[data-state="ahead"] { background: var(--health); }
  .delta[data-state="behind"] { background: var(--risk); }

  button {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-66);
    background: transparent;
    border: 1px solid var(--ink-22);
    border-radius: 3px;
    padding: 7px 12px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button:hover { color: var(--ink); border-color: var(--ink-42); }
  button:focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }
  button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--ink-06); }
  .btn-row { display: flex; gap: 8px; }

  /* ── shell ─────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-columns: 178px minmax(0, 1fr);
    gap: 32px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 28px 96px;
    align-items: start;
  }

  /* ── rail ──────────────────────────────────────────────── */
  .rail { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 1px; }
  .rail-head { padding: 0 0 10px 2px; }
  .rail button {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--sans);
    font-size: 12.5px;
    border: 0;
    border-radius: 4px;
    padding: 6px 8px;
    color: var(--ink-66);
  }
  .rail button .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-42); font-variant-numeric: tabular-nums; }
  .rail button .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail button:hover { background: var(--ink-06); color: var(--ink); }
  .rail button[aria-current="true"] { background: var(--ink); color: #fff; }
  .rail button[aria-current="true"] .n { color: rgba(255, 255, 255, 0.6); }
  .rail button.dropped { opacity: 0.34; }
  .rail button.dropped .t { text-decoration: line-through; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.hold { background: var(--risk); }
  .dot.cut { background: var(--caution); }

  /* ── card ──────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--ink-10);
    border-radius: 6px;
    box-shadow: var(--lift);
    padding: 30px 38px 34px;
    min-height: 62vh;
  }
  .card-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-head .num { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-42); }
  .flag { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; color: #fff; }
  .flag.hold { background: var(--risk); }
  .flag.cut { background: var(--caution); }

<script>
  var CARDS = [{"n": 0, "short": "The brief", "title": "What is true about this room before you open your mouth", "secs": 0, "facts": ["<b>Jennifer asked for this.</b> On 7/14 she asked Anika about “the global payroll solution that Prism integrates with now — I saw them at the conference.” On 7/21 she asked for the call herself and offered three days. This is inbound. Do not pitch like it isn’t.", "<b>She thinks Global is a third-party integration.</b> It isn’t. Correcting that is the single highest-value thing you say, and it belongs in the first thirty seconds.", "<b>Her real question is already on the record</b>, in her words: “Is this an add-on INF would need to implement in our account, or could a client specifically add this on?” That is service-provider level versus client level — the same question as slide 13. Answer it explicitly or the meeting didn’t happen.", "<b>Puerto Rico is the live pain</b>, plus “other international needs.” Puerto Rico is a US territory, not an EOR country. This deck does not solve it. Say so.", "<b>Global work leaves their P&amp;L today.</b> Domestic runs on our platform; the international side rides an outside alliance that comes up for a look this fall. Let <i>them</i> name that vendor. You never do.", "<b>The scar.</b> TZP Group — an Infiniti client — cancelled PrismHR Performance Management in the spring because the 360-review capability fell short of what was pitched, and Jennifer was on that thread. Every overclaim in this room costs more than it earns."], "rules": ["<b>Under-claim.</b> Where you don’t know, say you don’t know and say when you’ll know. One honest gap buys more than five capabilities.", "<b>Let them name the incumbent.</b> You never say the competitor’s name first. If they name it, you get to ask about it. If they don’t, you don’t need it today.", "<b>Ask about structure, not price.</b> Partner-quotable pricing is still open internally. Which contracting shape Scott wants is a real question you can act on. A number you’d have to walk back is the TZP mistake in a new costume."]}, {"n": 1, "short": "Without Borders", "title": "Compete Without Borders", "you": "0:22", "them": "0:30", "secs": 66, "type": "live", "label": "Live — ask the room, then stop talking", "hold": true, "say": ["Thanks for making room, all three of you. I’ll take about fifteen minutes and then it’s yours — and stop me anywhere, I’d rather answer than present.", "One correction first, because Jennifer’s note asked about the global payroll solution Prism integrates with. There’s no integration. PrismHR Global is ours. Same company, same platform, same login."], "ask": "Before I start: when the three of you put this on the calendar, what put it there? The Puerto Rico problem, something a client asked you for, or the way global works for you today?", "why": "Thirty seconds buys the real agenda and tells you which of the three chairs is driving. It also lets them raise the incumbent themselves.", "branches": [["Puerto Rico", "Promise it lands on slide 11, and hold the promise."], ["A client asked", "Get that client’s shape now — the rest of the deck reads through it."], ["How global works today", "The meeting is economics. Go to 8 and 13 early; treat 4 through 12 as reference."]]}, {"n": 2, "short": "Agenda", "title": "Agenda", "you": "0:12", "them": "", "secs": 26, "type": "planted", "label": "Planted — name her, don’t wait for an answer", "say": ["That’s the map. I’ll move through the middle quickly — it’s reference. The time goes to two places: how a deal actually works between us, and where the money lands."], "ask": "Jennifer, you asked Anika whether this is something Infiniti adds at the service-provider level or something a client adds on their own. That’s the right question, and it’s where I want to land. Hold me to it.", "why": "It repeats her own question back in her own words, which proves she was read, and posts the address so slide 13 arrives as a payoff instead of a surprise. You are not asking for an answer here."}, {"n": 3, "short": "PrismHR stats", "title": "PrismHR Solutions", "you": "0:22", "them": "0:12", "secs": 44, "type": "quick", "label": "Quick — to Javier, expect a sentence", "cut": "Cut 2nd", "say": ["Two numbers here matter. We reach a hundred seventy-five-plus countries and own the entity in forty-five-plus of them. Owned is the word — where we own it, we’re the employer, not a broker handing you to a local firm. The rest of the page is credibility, and you already know this company’s domestic half."], "ask": "Javier, when one of your clients needs one person paid in one other country — how many outside parties does your team touch to get that done?", "why": "The COO owns delivery cost. A count is easy to say out loud and impossible to un-hear. Whatever number he gives becomes your reference point on 8 and 13."}, {"n": 4, "short": "Why go global", "title": "Why Your Clients Go Global", "you": "0:34", "them": "0:12", "secs": 54, "type": "quick", "label": "Quick — to Scott", "say": ["This page is written for your clients. I’d rather read it as your revenue line.", "Your clients are already doing these things. Somebody in your book has already asked about a developer in Mexico or a contractor in India — in a book your size that demand exists whether or not it reaches this floor. The question is whether Infiniti earns on it or hands it away. Every one of those asks is either a service you sell or a referral you make for free."], "ask": "How many of those asks actually reach you in a year — and what happens to them when they do?", "why": "It makes the leak countable before slide 8 asks him to price it. If the honest answer is “we don’t really know,” that is itself the finding — and it makes the small next move on 15 easy to accept."}, {"n": 5, "short": "The challenges", "title": "The Global Challenges Your Clients Bring to You", "you": "0:25", "them": "", "secs": 41, "type": "planted", "label": "Planted — aimed at Javier, answered by you", "say": ["Five challenges from the client’s side. From your side there’s one: the moment a client asks and you say yes, their problem is your problem. Misclassification, permanent establishment, a termination rule nobody read — those land on whoever’s name is on the paper.", "Underline the last one. Most clients don’t need an entity. They need one person, in one country, next month."], "ask": "When a client asks you to pay someone in another country today — who at Infiniti owns the answer, and how long does it take? You don’t have to answer that out loud. That cycle time is the cost this replaces.", "why": "It plants the operational cost without making the COO admit a number in front of his CEO. If he volunteers it anyway, you’ve earned it rather than extracted it."}, {"n": 6, "short": "Enter Global", "title": "Enter PrismHR Global", "you": "0:34", "them": "0:12", "secs": 54, "type": "quick", "label": "Quick — to Jennifer", "say": ["The whole thing in one line: find, hire, pay, manage — across a hundred seventy-five-plus countries, without you or your client standing up infrastructure anywhere.", "The part to hear twice: this is not a partner we route you to. It’s a product family inside the platform Infiniti already runs on. For your team it’s another area of the same system, same login. Nothing to integrate, nothing to sync, nothing for your IT to own.", "That’s the difference between adding a vendor and turning something on."], "ask": "If this lands inside the environment your implementation team already trains people on — what in your onboarding process stops being necessary?", "why": "The implementation lead’s question in her own currency. It converts “new product” into “less work,” and her answer sizes the lift — which sets how big an ask you can make on 15."}, {"n": 7, "short": "Four products", "title": "Help Clients Grow Globally with PrismHR Global", "you": "0:26", "them": "", "secs": 38, "type": "planted", "label": "Planted — to the room, answered by you", "say": ["Four instruments, one relationship. Employer of record when your client needs a real employee where they have no entity. Contractor support when the work is genuinely project-based. Global payroll when they already have people abroad and the paying is the mess. Talent when they don’t know who to hire yet.", "You don’t pick one — you pick per client, per country, same agreement underneath."], "ask": "Which of these four covers the most clients in your book — and which covers the client you’d least like to lose? Different answers, usually. The second is where to start.", "why": "It reframes the pilot from biggest volume to highest retention risk — where a PEO’s real urgency lives, and where a first win is worth the most to them internally."}, {"n": 8, "short": "Why partner", "title": "Why Service Providers Partner With PrismHR Global", "you": "0:51", "them": "0:40", "secs": 104, "type": "live", "label": "Live — to Scott. His question, nobody else’s", "hold": true, "say": ["This is the page I’d have written differently. Here’s the version that’s true for a provider your size.", "The bullet that isn’t up there is the one that matters: today, when a client of yours hires abroad, that revenue leaves your P&L. Someone earns on it. It isn’t you.", "What’s on offer is that the work stays inside your relationship and inside your margin. Your team stays the single point of contact, your brand stays on the front, and the client never has to meet us if you don’t want them to.", "The four that are up there — fewer vendors, in-country expertise, room to grow from a first hire to a whole team, flexible ways to move money — all real, all secondary to that one."], "ask": "Scott, when one of your clients hires internationally today, does Infiniti earn anything on it? And if the answer’s no — is that a pricing decision, or just how the arrangement got built?", "why": "The CEO’s question, and nobody else in the room can answer it. The second half is the important half: it hands him a face-saving answer and turns a defensive question into a design conversation.", "branches": [["We earn nothing", "You’re done selling. Go to 13 and spend the rest of the time there."], ["We have an arrangement", "Do not name it. “Is it working, and when does it next come up for a look?”"], ["We don’t see those asks", "“Then the first thing worth building isn’t a product, it’s a way to hear the asks — and that’s a smaller project than this deck.”"]]}, {"n": 9, "short": "Employer of Record", "title": "Global Employer of Record", "you": "0:30", "them": "", "secs": 46, "type": "planted", "label": "Planted — aimed at Jennifer", "cut": "Cut 3rd", "say": ["Employer of record, two shapes. Core: your client already has the person — a name, a country, a start date. We employ them under our entity, your client directs the work, we carry the legal employer obligations. Plus is the same when they don’t have the person yet; we recruit first.", "Mechanically, the employment contract is between the worker and PrismHR, and our agreement with your client assigns that worker to them. That’s the whole trick."], "ask": "Which arrives more often — a client with a name and a country already picked, or one who says “we need someone in Poland” and stops there? However that splits, Plus is the one your clients can’t do without you.", "why": "The split between the tiers is the difference between being a pass-through and being needed. Planting it means she hears the strategic point without having to produce data on the spot."}, {"n": 10, "short": "Contractors", "title": "Global Contractor Solutions", "you": "0:39", "them": "0:12", "secs": 60, "type": "quick", "label": "Quick — to Javier. The sharpest one in the deck", "say": ["Contractors, two roads, and the difference is who holds the paper.", "Contractor management: the contract is between your client and the contractor; we’re the method of payment and the workflow. Contractor of record: the contract sits with PrismHR as agent of record, and we run a classification review before anyone gets paid.", "Straight talk on the second one. Classification isn’t paperwork that turns an employee into a contractor. If the role is employee-shaped — fixed schedule, one client, a manager — the honest answer is employer of record. We’d tell your client that. And we’d tell you first."], "ask": "How many of your clients are paying somebody overseas out of accounts payable right now — and would you know if they were?", "why": "Contractor sprawl is invisible to the PEO until it becomes the PEO’s problem, and “would you know” is the part that lands. It also sets up the pilot: finding out is a small, safe first move."}, {"n": 11, "short": "Payroll · PR", "title": "Global Payroll — and Puerto Rico", "you": "0:36 + 0:25", "them": "0:40", "secs": 119, "type": "live", "label": "Live — to Jennifer, after you decline to sell", "hold": true, "say": ["Payroll’s the least glamorous page and the one your finance people will care about most. Localized processing and filing, multi-currency, country-specific deductions and benefits, one consolidated report, and a general-ledger export into whatever they already run.", "The mechanical bit: your client pays one invoice, in dollars, into a US bank. We convert, pay the workers locally in their own currency, and remit taxes to that country’s authority. No international wires leaving your client’s bank — which also keeps them from signalling to a foreign tax authority that they’re paying people there."], "beat": {"label": "Now stop, change tone — this beat is not optional", "say": ["Now — Puerto Rico. I’ll be precise rather than fast.", "Puerto Rico isn’t an international country for this. It’s a US territory with its own tax code and its own filings. It is not solved by the page you’re looking at, and I’m not going to tell you it is. Let me take it back and come to you with a real answer instead of a maybe."]}, "ask": "So tell me which half hurts — running the payroll itself, or the filings and the local agency side? Those are two different fixes, and I’d rather bring you the right one than the fast one.", "why": "The most valuable forty seconds in the meeting, and it has nothing to do with the deck. Jennifer watched a PrismHR capability get sold past what it could do this spring. Declining to oversell the exact thing she asked about, in front of her CEO, is the one move that buys that credit back. The question is also genuinely diagnostic — processing and filings are different problems with different owners."}, {"n": 12, "short": "Talent", "title": "Global Talent", "you": "0:20", "them": "", "secs": 33, "type": "planted", "label": "Planted — to Scott", "cut": "Cut 1st", "say": ["Fastest page. Two things: we recruit and place, or we recruit and then run the whole employment relationship — workspace, HR oversight, local support — in the countries where we offer it.", "This is the one you’re least likely to need first, and I’d rather tell you that than sell it."], "ask": "Have your clients ever lost work because they couldn’t staff a role somewhere? That’s the only condition under which this page matters, and it’s worth knowing whether it’s ever happened to you.", "why": "Deliberately deflating the weakest slide is a deposit, not a loss — it makes the things you did claim more believable, which is the whole strategy in this room. If you’re behind, this is the first page to drop."}, {"n": 13, "short": "Operating model", "title": "The Operating Model", "you": "0:47", "them": "0:50", "secs": 115, "type": "live", "label": "Live — to Scott and Javier together. The meeting", "hold": true, "say": ["If we only had one page, this is it.", "Three boxes. Your client works with Infiniti — the point of contact they already have. Infiniti delivers the global service and owns the relationship. We sit behind you: entities, compliance, the employer-of-record and contractor work, the back end.", "One decision lives inside that picture and it’s yours, not ours. Either Infiniti holds the client contract and resells this at your margin — you’re the provider, we’re your supplier — or we contract directly with the client and pay Infiniti a fee on the referral. Both are real. They’re different businesses, and they change who carries the service obligation when something goes wrong at eleven at night in Manila."], "ask": "Which of those two do you want? And I’ll say this plainly: I’m asking about the structure, not the price. I don’t have a rate sheet I can hand you today, and I’m not going to invent one in the room and correct it next week.", "why": "This is the answer to Jennifer’s original question — service-provider level versus client level — and the one piece of information that changes what happens next inside their building. Naming the pricing gap out loud costs nothing they wouldn’t discover anyway, and in this account it is the proof that the TZP pattern isn’t repeating.", "branches": [["We hold the contract", "They want margin and control. Next conversation is commercial terms — you need pricing before it."], ["You contract, pay us", "They want zero service obligation. Next conversation is the referral mechanic and who touches the client."], ["Depends on the client", "The best answer. “Then let’s pick the client and let it decide” — which is exactly slide 15."]]}, {"n": 14, "short": "Success story", "title": "Provider Success Story", "you": "0:33", "them": "", "secs": 52, "type": "planted", "label": "Planted — to the room, answered by you", "say": ["One story, short. A dental technology company wanted a software team in Costa Rica, fast, without standing up their own entity. Recruiting plus employer of record put sixty-plus people in seats in under four months, heading toward a hundred.", "What the provider cared about: flat monthly pricing with no surprises, one vendor to manage, and a client they kept instead of losing to somebody who had a global answer. The figure on the page is theirs. It isn’t a promise about you."], "ask": "What would you need to see actually work before you’d put a real client on this — and could that be one client rather than a program? The version that fails is the one where you announce a global capability to your whole base before you’ve run one.", "why": "It pre-empts the “let’s think about it” close by naming the smallest credible commitment before they have to invent one. The last line gives them permission to go small — which a CEO and a COO both want and neither will say first."}, {"n": 15, "short": "Close", "title": "Help Your Clients Go Global", "you": "0:30", "them": "0:40", "secs": 74, "type": "live", "label": "Live — ask it, then do not fill the silence", "hold": true, "say": ["That’s the fifteen minutes, and I’m not going to ask what you thought of it.", "I’ll ask for something smaller. One client, one country, one working session — Jennifer’s implementation people, whoever owns that client, and me. We scope it end to end and you see exactly what it costs Infiniti to deliver before anybody promises a client anything.", "And separately, I come back to you on Puerto Rico."], "ask": "So — which client, and what’s the timing you’re actually working against?", "why": "Two asks in one sentence, and the second is the one you need. “What timing are you working against” invites them to raise their own deadline — the alliance, a client commitment, a budget cycle — without you ever naming it. Whatever date comes out of their mouths is the date the account plan runs on."}];

            '<div class="say">' + c.beat.say.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div></div>"
          : "") +
        '<div class="ask"><div class="ask-label"><span class="pip"></span><span class="kicker">' + esc(c.label) + "</span></div>" +
        "<q>" + esc(c.ask) + "</q></div>" +
        '<p class="note"><b>Why.</b> ' + c.why + "</p>" +
        (c.branches
          ? '<div class="branches">' +
            c.branches.map(function (b) { return '<div class="branch"><em>' + esc(b[0]) + "</em><div>" + esc(b[1]) + "</div></div>"; }).join("") +
            "</div>"
          : "") +
        '<p class="hint">← →  to move · space to start and stop the clock</p>' +
        "</article>";
    }
    stage.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("#rail button"), function (b) {
      b.setAttribute("aria-current", String(Number(b.dataset.n) === c.n));
    });
    document.getElementById("where").textContent =
      c.n === 0 ? "Brief" : "Slide " + c.n + " · mark " + mmss(targetAt(idx));
    document.getElementById("target").textContent = "of " + mmss(totalSecs());
    tick();
  }

  function tick() {
    document.getElementById("elapsed").textContent = mmss(elapsed);
    var d = document.getElementById("delta");
    var list = active();
    var mark = list[idx] && list[idx].n === 0 ? 0 : targetAt(idx);
    if (!running && elapsed === 0) {
      d.textContent = "READY";
      d.dataset.state = "";
      return;
    }
    var diff = elapsed - mark;
    if (Math.abs(diff) < 15) { d.textContent = "ON PACE"; d.dataset.state = ""; }
    else if (diff < 0) { d.textContent = mmss(-diff) + " AHEAD"; d.dataset.state = "ahead"; }
    else { d.textContent = mmss(diff) + " OVER"; d.dataset.state = "behind"; }
  }

  function toggleRun() {
    running = !running;
    document.getElementById("run").textContent = running ? "Pause" : "Start";
    document.getElementById("run").setAttribute("aria-pressed", String(running));
    if (running) ticker = setInterval(function () { elapsed += 1; tick(); }, 1000);
    else clearInterval(ticker);
  }

  document.getElementById("run").onclick = toggleRun;
  document.getElementById("reset").onclick = function () {
    if (running) toggleRun();
    elapsed = 0; idx = 0; draw();
  };
  document.getElementById("mode").onclick = function () {
    precut = !precut;
    this.textContent = precut ? "Pre-cut run" : "All fifteen";
    this.setAttribute("aria-pressed", String(precut));
    idx = 0; renderRail(); draw();
  };
  document.getElementById("prev").onclick = function () { idx -= 1; draw(); };
  document.getElementById("next").onclick = function () { idx += 1; draw(); };

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "BUTTON" && e.key === " ") return;
    if (e.key === "ArrowRight") { idx += 1; draw(); }
    else if (e.key === "ArrowLeft") { idx -= 1; draw(); }
    else if (e.key === " ") { e.preventDefault(); toggleRun(); }
  });

  renderRail();
  draw();
</script>
